<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        .thank-you-page {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }
        .text-container {
            background-color: white;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 20px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .thank-you-message {
            font-size: 24px;
            text-align: center;
            margin-bottom: 20px;
        }
        .completion-info {
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="thank-you-page" class="thank-you-page">
        <div class="text-container">
            <p class="thank-you-message">
                <b>Thanks for taking a task!</b>
            </p>
            <p class="completion-info">
                Your completion code is <b>ABCDEF</b>. Please submit from <a href="https://app.prolific.com/submissions/complete?cc=ABCDEF" target="_blank">here</a>.
            </p>
        </div>
    </div>

    <script>
        console.log('Thank you page HTML loaded');
        window.onload = function() {
            console.log('Thank you page window loaded');
        };
    </script>
</body>
</html>
